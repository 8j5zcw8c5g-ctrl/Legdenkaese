*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--yel:#ffc531;--ora:#ff8a2b;--pink:#ff4f9a;--ink:#3a2340;--soft:#8a7180;--bg:#fff8e9;--card:#ffffff;--line:#f3e2c8;--green:#22c27a;--red:#ff4d5e;--blue:#3aa8ff;--purple:#8a4dff;
  --grad:linear-gradient(135deg,#ffc531 0%,#ff8a2b 50%,#ff4f9a 100%);--grad2:linear-gradient(135deg,#ff8a2b,#ff4f9a);--gradY:linear-gradient(135deg,#ffd75a,#ffb21f);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
html,body{margin:0;height:100%;background:#3a2340;color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
/* Mindestens 16px: sonst zoomt iOS beim Antippen eines Eingabefelds hinein */
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
[hidden]{display:none!important}
#app{position:fixed;inset:0;max-width:540px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* Icons (Masken) */
.ico{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}

.coin{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffcf3a 45%,#e8a612);box-shadow:inset 0 0 0 2px #c98a0c;flex:none}
/* Figuren-Animation */
.fig{display:block;width:100%;height:100%}
.fig .fa-body{animation:faBody 4.2s ease-in-out infinite;animation-delay:var(--d)}
.fig .fa-head{animation:faHead 4.2s ease-in-out infinite;animation-delay:var(--d);transform-origin:150px 190px}
.fig .fa-hairb{animation:faHair 4.2s ease-in-out infinite;animation-delay:var(--d);transform-origin:150px 190px}
.fig .fa-lid{animation:faBlink 5s infinite;animation-delay:var(--d)}
.fig.still *{animation:none!important}
@keyframes faBody{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes faHead{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes faHair{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-2.5px) rotate(1.4deg)}}
@keyframes faBlink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
/* Kopfzeile */
#top{flex:none;height:calc(54px + var(--sat));padding:var(--sat) var(--gr) 0 var(--gl);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;box-shadow:0 2px 10px rgba(255,138,43,.12);z-index:5}
.logo{display:flex;align-items:center;gap:5px;min-width:0}.logo .lk{width:34px;height:34px;flex:none}.logo .lk svg{width:100%;height:100%;display:block}
.logo b{font-weight:800;font-style:italic;font-size:19px;letter-spacing:-.4px;background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.chips{display:flex;gap:5px;align-items:center;min-width:0}
.chip{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:16px;font-weight:700;font-size:13px;background:#fff3dc;color:var(--ink);white-space:nowrap}
.chip.rank{color:#fff;background:var(--rc,#b9a99a);max-width:150px;min-width:0}.chip.rank span{overflow:hidden;text-overflow:ellipsis}.chip.rank b{font-weight:800}.chip.rank.king{background:linear-gradient(135deg,#ffd75a,#e8a612);color:#3a2340}
.chip.gear{width:32px;padding:0;justify-content:center;font-size:18px;color:var(--soft)}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}}
@media (max-width:440px){.chip.rank span{display:none}.chip.rank{padding:0 9px}}@media (max-width:350px){.logo b{font-size:16px}.chip{padding:0 8px}}
/* Ansichten */
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px var(--gr) 24px var(--gl);display:block}
#tabs{flex:none;display:flex;background:#fff;height:calc(62px + var(--sab));padding-bottom:var(--sab);border-top:1px solid var(--line);z-index:5}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:#c3b2a6;position:relative}
#tabs button .ico{font-size:25px}
#tabs button.on{color:var(--ora)}#tabs button.on .ico{background:var(--grad)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-style:normal;font-size:11px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 2px #fff}
/* Kartenstapel */
#deck{flex:1;position:relative;margin:8px var(--gr) 0 var(--gl)}
.likebar{flex:none;align-self:center;display:flex;align-items:center;gap:6px;margin:10px 0 0;padding:5px 14px;border-radius:16px;background:#fff;box-shadow:0 2px 8px rgba(255,79,154,.15);font-size:13px;font-weight:700;color:var(--soft)}
.likebar .ico{color:var(--pink);font-size:15px}.likebar b{color:var(--pink);font-size:15px;font-weight:800}
.likebar.empty b{color:var(--red)}.likebar.shake{animation:shake .4s}
.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:#f6e3c0;box-shadow:0 10px 30px rgba(120,60,20,.22);touch-action:none;will-change:transform;transform-origin:50% 120%}
.card.under{transform:scale(.95) translateY(10px);filter:brightness(.93)}
.card.anim{transition:transform .35s cubic-bezier(.2,.8,.3,1.1)}
.card .pic{position:absolute;inset:0}.card .pic svg{width:100%;height:100%;display:block}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:70px 16px 14px;color:#fff;background:linear-gradient(transparent,rgba(40,16,30,.55) 30%,rgba(40,16,30,.9))}
.card h2{margin:0;font-size:28px;font-weight:800;line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.3)}.card h2 span{font-weight:500;font-size:24px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.22);font-size:12px;font-weight:700;backdrop-filter:blur(4px)}
.tag.type{background:var(--grad2)}.tag.diff{background:rgba(0,0,0,.3)}
.ctype{background:var(--grad2)}.t-lieb{background:linear-gradient(135deg,#ff8fc0,#ff4f9a)}.t-flirty{background:linear-gradient(135deg,#ff3d3d,#c8102e)}.t-sport{background:linear-gradient(135deg,#2fcf86,#1a9e6a)}
.t-wild{background:linear-gradient(135deg,#4a1830,#1d1d24)}.t-frech{background:linear-gradient(135deg,#a36bff,#7a3df0)}.t-shy{background:linear-gradient(135deg,#7fc8ff,#4f8cff)}.t-hard{background:linear-gradient(135deg,#5fd0e0,#3a8ab0)}#chat.rival .symrow,#chat.rival #callBtn{display:none}
.t-rival{background:linear-gradient(135deg,#ffd75a,#e8a612);color:#3a2340}
.rivalrow{background:linear-gradient(135deg,#fff6d8,#ffe7f1);box-shadow:0 0 0 2px #ffd75a}.rtag{font-size:11px;font-weight:800;color:#b07800;margin-left:4px}
.t-hater{background:linear-gradient(135deg,#e8333a,#4a1830)}.t-streng{background:linear-gradient(135deg,#c8102e,#5a1a6a)}
.t-troll{background:linear-gradient(135deg,#ff9a3d,#8a4dff)}
.card .sucht{margin:2px 0 0;font-size:12.5px;font-weight:700;opacity:.95}
.pjob{font-size:12px;font-weight:700;color:var(--ink);line-height:1.45}
.card .bio{margin:6px 0 0;font-size:14px;line-height:1.35;font-weight:500}
.card .picky{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.92);color:var(--pink);font-size:11px;font-weight:800;letter-spacing:.5px}
.stamp{position:absolute;top:34px;padding:4px 14px;border:5px solid;border-radius:12px;font-size:36px;font-weight:800;letter-spacing:2px;opacity:0;pointer-events:none;background:rgba(255,255,255,.35)}
.stamp.like{left:22px;color:var(--green);transform:rotate(-16deg)}.stamp.nope{right:22px;color:var(--red);transform:rotate(16deg)}.stamp.sup{left:50%;top:auto;bottom:44%;color:#f0a21b;transform:translateX(-50%) rotate(-8deg);white-space:nowrap}
.actions{flex:none;display:flex;justify-content:center;align-items:center;gap:22px;padding:14px 0 16px}
.act{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(120,60,20,.18);display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;transition:transform .12s}
.act:active{transform:scale(.88)}
.act.nope{color:var(--red)}.act.like{color:#fff;background:var(--grad)}.act.sup{width:54px;height:54px;font-size:27px;color:#f0a21b}
.act.sup em{position:absolute;top:-5px;right:-8px;min-width:24px;height:20px;border-radius:10px;background:var(--gradY);color:#5a3a00;font-size:11px;font-style:normal;font-weight:800;line-height:20px;text-align:center;box-shadow:0 0 0 2px #fff;padding:0 5px}
.act.like em{position:absolute;top:-5px;right:-6px;min-width:24px;height:22px;border-radius:11px;background:#fff;color:var(--pink);font-size:12px;font-style:normal;font-weight:800;line-height:22px;text-align:center;box-shadow:0 0 0 2px var(--pink);padding:0 5px}
.act.like.empty{background:#d9cbbf;box-shadow:none}.act.like.empty em{color:#a09080;box-shadow:0 0 0 2px #d9cbbf}
.act.shake{animation:shake .4s}.act.bump{animation:bump .5s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#deckEmpty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.empty-ico{width:110px;height:110px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:56px;animation:pulse 1.6s infinite}
#deckEmpty h3{margin:16px 0 4px;font-size:22px}#deckEmpty p{margin:0 0 18px;color:var(--soft)}
@keyframes pulse{50%{transform:scale(1.08)}}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:25px;font-weight:800;font-size:16px;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btn.prim{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,79,154,.3);text-shadow:0 1px 2px rgba(120,40,0,.25)}
.btn.white{background:#fff;color:var(--pink)}.btn.ghost{border:2px solid rgba(255,255,255,.85);color:#fff}
.btn.small{height:38px;padding:0 16px;font-size:14px;border-radius:19px}
.btn.green{background:linear-gradient(135deg,#2fcf86,#1fae9a);color:#fff}
.btn.gray{background:#f1e6da;color:#8a7a6a}
.btn.line{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn.block{display:flex;width:100%}
/* Match */
#matchOv{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(255,197,49,.97),rgba(255,138,43,.96) 45%,rgba(255,79,154,.97));color:#fff;text-align:center}
.mo-in{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;width:100%}
.mtitle{margin:0;font-size:72px;line-height:.95;font-weight:800;font-style:italic;text-shadow:0 5px 0 rgba(160,60,0,.25);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#moTxt{margin:0 0 6px;font-weight:700;font-size:16px}
.mo-avs{display:flex;align-items:center;justify-content:center;margin:6px 0 18px;position:relative}
.mo-av{width:130px;height:130px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.2);background:#fff}.mo-av svg{width:100%;height:100%;display:block}
.mo-av.l{animation:slideL .7s cubic-bezier(.2,1.4,.4,1);margin-right:-14px;transform:rotate(-8deg)}.mo-av.r{animation:slideR .7s cubic-bezier(.2,1.4,.4,1);margin-left:-14px;transform:rotate(8deg)}
.mo-heart{position:absolute;left:50%;top:50%;font-size:58px;margin:-29px 0 0 -29px;color:#fff;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:beat 1s infinite;z-index:2}
#matchOv .btn{width:min(320px,86%)}
@keyframes pop{0%{transform:scale(.2);opacity:0}}@keyframes slideL{0%{transform:translateX(-200px) rotate(-30deg)}}@keyframes slideR{0%{transform:translateX(200px) rotate(30deg)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
/* Chats-Liste */

function rankIdx(xp){let r=0;for(let i=0;i<RANKS.length;i++)if(xp>=RANKS[i].xp)r=i;return r;}

const BAD_WORDS=/\b(geil|sexy|heiß|heiss|nackt|bett|arsch|schlampe|fick|titten|busen)\b/i;
function bioScore(){const b=(S.bio||'').trim();if(S.bioAI&&S.bioAI.bio===b)return S.bioAI.score;if(!b)return 0;if(BAD_WORDS.test(b))return 0;let s=b.length<15?2:b.length<40?5:b.length<160?8:6;
  if(/[?!]/.test(b))s+=1;if(/\p{Extended_Pictographic}/u.test(b))s+=1;if(/(lach|witz|humor|pizza|reisen|hund|katze|musik|kochen|sport|buch|film|abenteuer|kaffee|käse)/i.test(b))s+=2;return Math.min(12,s);}
function attrParts(){const L=playerLook(),P=[];const add=(n,v)=>P.push({n,v});add('Grundwert',8);
  for(const [c,lbl] of [['top','Oberteil'],['bottom','Hose'],['shoes','Schuhe'],['glasses','Brille'],['hat','Kopfbedeckung'],['neckl','Kette'],['watch','Uhr'],['scene','Hintergrund']]){const it=shopItem(c,L[c]);if(it&&(it.st||c==='top'))add(lbl+': '+it.n,it.st);}
  add('Bio',bioScore());if(S.rank)add('Rang: '+RANKS[S.rank].n,S.rank*3);return P;}
function attractiveness(){return clamp(Math.round(attrParts().reduce((a,b)=>a+b.v,0)),0,100);}
function affinity(interest){const L=playerLook();let a=0;for(const c of ['top','bottom','shoes','glasses','hat','neckl','watch','scene']){const it=shopItem(c,L[c]);if(it&&it.tags.includes(interest))a+=c==='scene'?.08:.05;}return Math.min(.25,a);}

function ensureDaily(){refreshLikes();const d=todayKey();if(S.daily.day===d)return false;S.daily.day=d;const R=seeded(hashStr(d+'k')),pool=TASKS.map(t=>t.id);const tasks=[];
  while(tasks.length<3){const id=pool.splice((R()*pool.length)|0,1)[0];tasks.push({id,prog:0,done:false,claimed:false});}S.daily.tasks=tasks;S.daily.chatIds=[];saveSoon();return true;}
function taskDef(id){return TASKS.find(t=>t.id===id);}
function taskEvent(id,n,key){ensureDaily();if(id==='chats'){if(S.daily.chatIds.includes(key))return;S.daily.chatIds.push(key);}
  for(const t of S.daily.tasks){if(t.id!==id||t.done)continue;const T=taskDef(id);t.prog=Math.min(T.goal,t.prog+(n||1));if(t.prog>=T.goal){t.done=true;if(typeof uiTaskDone==='function')uiTaskDone(T);}}saveSoon();if(typeof uiBadges==='function')uiBadges();}
function claimTask(i){const t=S.daily.tasks[i];if(!t||!t.done||t.claimed)return false;const T=taskDef(t.id);t.claimed=true;addCoins(T.coins);addXP(T.xp);saveNow();return true;}

function historyTurns(st,limit){const out=[];const src=st.msgs.filter(m=>m.f==='me'||m.f==='her').slice(-(limit||40));
  for(const m of src){const role=m.f==='me'?'user':'assistant';let t=(m.call?'(im Videoanruf) ':'')+(m.t||'');
    if(m.img)t='(Er schickt dir ein Foto'+(m.desc?': '+m.desc:'')+')'+(m.t?' '+m.t:'');else if(m.voice)t='(Sprachnachricht) '+(m.t||'(nicht zu verstehen, es rauscht)');else if(m.selfie)t='(Du schickst ihm ein Selfie)'+(m.t?' '+m.t:'');else if(m.vm)t='(als Sprachnachricht) '+m.t;if(out.length&&out[out.length-1].role===role)out[out.length-1].content+='\n'+t;else out.push({role,content:t});}
  if(!out.length||out[0].role!=='user')out.unshift({role:'user',content:'(Wir haben gerade gematcht.)'});if(out[out.length-1].role!=='user')out.push({role:'user',content:'(…)'});return out;}
class AIError extends Error{constructor(code,msg){super(msg||code);this.code=code;}}

async function pendingImages(st){const ids=[];for(let i=st.msgs.length-1;i>=0;i--){const m=st.msgs[i];if(m.f==='her')break;if(m.f==='me'&&m.img)ids.unshift(m.img);}
  const out=[];for(const id of ids.slice(-2)){try{const b=await mediaGet(id);if(b)out.push(b);}catch(_){}}return out;}
async function attachImages(messages,blobs){if(!blobs||!blobs.length)return messages;messages=messages.map(m=>({role:m.role,content:m.content}));const last=messages[messages.length-1];const parts=[];
  for(const b of blobs){try{parts.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await blobToB64(b)}});}catch(_){}}last.content=parts.concat([{type:'text',text:String(last.content)}]);return messages;}
async function serverFetch(path,body,ms){const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=ctl?setTimeout(()=>ctl.abort(),ms||45000):0;
  try{return await fetch(String(CONFIG.aiServerUrl).replace(/\/+$/,'')+path,{method:'POST',headers:{'content-type':'application/json','x-device-id':deviceId(),'x-app-version':VERSION},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined});}
  finally{if(t)clearTimeout(t);}}
async function callServer(system,messages,tool,maxTok,blobs){if(!serverReady())throw new AIError('noserver');if(navigator.onLine===false)throw new AIError('offline');
  messages=await attachImages(messages,blobs);let res;
  try{res=await serverFetch('/chat',{system,messages,tool,max_tokens:maxTok||700});}
  catch(e){throw new AIError(navigator.onLine===false?'offline':e&&e.name==='AbortError'?'timeout':'network');}
  const left=res.headers.get('x-remaining');if(left!==null&&left!==''){S.aiUse={day:todayKey(),left:Math.max(0,parseInt(left,10)||0),limit:parseInt(res.headers.get('x-limit'),10)||CONFIG.dailyLimit};saveSoon();}
  if(!res.ok){let j=null;try{j=await res.json();}catch(_){}const code=j&&j.error;
    if(code==='limit'){S.aiUse={day:todayKey(),left:0,limit:(j&&j.limit)||CONFIG.dailyLimit};saveSoon();throw new AIError('limit');}
    if(code==='global')throw new AIError('global');if(res.status===429)throw new AIError('rate');if(res.status>=500)throw new AIError(code==='setup'?'noserver':'busy');throw new AIError('bad',j&&j.message);}
  let j;try{j=await res.json();}catch(_){throw new AIError('busy');}const tu=(j.content||[]).find(c=>c.type==='tool_use');if(!tu)throw new AIError('empty');return tu.input||{};}
async function callApp(system,messages,jsonHint,blobs){const turns=messages.map(m=>({role:m.role,content:m.content}));turns[0].content=system+'\n\n--- Ab hier beginnt der Chat. Seine Nachrichten kommen als „user“, deine als „assistant“. ---\n\n'+turns[0].content;turns[turns.length-1].content+='\n\n'+jsonHint;
  try{const o={modelTier:'quick',cache:false};if(blobs&&blobs.length)o.images=blobs;return await AI.app.json(turns,o);}
  catch(e){const c=e&&e.code;if(blobs&&blobs.length&&(c==='images_unavailable'||c==='image_rejected')){turns[turns.length-1].content+='\n(Das Foto kannst du leider nicht sehen.)';return callApp(system,messages,jsonHint,null);}if(c==='not_granted'||c==='sampling_disabled'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'||c==='session_expired'){AI.app=null;throw new AIError('denied');}if(c==='rate_limited')throw new AIError('rate');if(c==='refused')throw new AIError('refused');if(c==='invalid_json'||c==='empty_completion')throw new AIError('empty');throw new AIError('busy');}}
function cleanReply(x,mode){const out={antwort:String(x.antwort||'').trim().slice(0,600),sympathie:Math.round(Number(x.sympathie)||0),grund:String(x.grund||'').trim().slice(0,60),stimmung:MOODS.includes(x.stimmung)?x.stimmung:'neutral',
    merken:String(x.merken||'').trim().slice(0,120),blockieren:!!x.blockieren,selfie:!!x.selfie,bild:String(x.bild||'').trim().slice(0,80)};

  d.innerHTML='<defs>'+ids.map(id=>`<image id="phimg-${id}" href="${photoSrc(id)}" x="0" y="0" width="${PH_W}" height="${PH_H}" preserveAspectRatio="none"/>`).join('')+'</defs>';document.body.appendChild(d);}
function photoFace(p){const [a,b,c,d]=p.photo.f;return {x:a*PH_W,y:b*PH_H,w:(c-a)*PH_W,h:(d-b)*PH_H};}
function photoSVG(id,view,o){const p=PEOPLE[id];photoDefs();const F0=photoFace(p),cx=F0.x+F0.w/2,cy=F0.y+F0.h/2;let vb=[0,0,PH_W,PH_H],par='xMidYMin slice';
  if(view==='head'){const s=Math.max(F0.w,F0.h)*1.2;vb=[cx-s/2,cy-s/2-F0.h*.04,s,s];par='xMidYMid slice';}
  else if(view==='bust'){const h=F0.h*2.9,w=h*.72;vb=[cx-w/2,Math.max(0,F0.y-F0.h*.35),w,h];par='xMidYMin slice';}
  return `<svg viewBox="${vb.map(r1).join(' ')}" preserveAspectRatio="${par}" class="fig photo" role="img" aria-label="${esc(p.name)}"><use href="#phimg-${id}"/></svg>`;}

/* Käse-Konfetti */
const FX={parts:[],run:false,cv:null,ctx:null};
function confetti(n,ox,oy,cheesy){const cv=FX.cv||(FX.cv=$('#fx'));const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);}
  FX.ctx=cv.getContext('2d');FX.dpr=dpr;const W=r.width,H=r.height,cols=['#ff4f9a','#ffc531','#ff8a2b','#ffffff','#ffd75a','#ff7fae','#8a4dff'];
  for(let i=0;i<n;i++){const hx=ox==null?W/2:ox,hy=oy==null?H*.35:oy;const a=rnd(0,Math.PI*2),v=rnd(4,13);const k=Math.random();
    FX.parts.push({x:hx,y:hy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:rnd(0,6.3),vr:rnd(-.25,.25),w:rnd(6,11),h:rnd(4,8),c:pick(cols),t:k<(cheesy?.5:.12)?'cheese':k<(cheesy?.72:.32)?'heart':'rect',s:rnd(.9,1.5),life:rnd(1.6,2.8)});}
  if(!FX.run){FX.run=true;FX.last=performance.now();requestAnimationFrame(fxStep);}}
function fxStep(now){const dt=Math.min(.05,(now-FX.last)/1000);FX.last=now;const x=FX.ctx,cv=FX.cv;x.setTransform(FX.dpr,0,0,FX.dpr,0,0);x.clearRect(0,0,cv.width,cv.height);
  for(let i=FX.parts.length-1;i>=0;i--){const p=FX.parts[i];p.life-=dt;if(p.life<=0){FX.parts.splice(i,1);continue;}p.vy+=22*dt;p.vx*=.985;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60*.5;p.r+=p.vr;
    x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.min(1,p.life*1.5);
    if(p.t==='cheese'){x.scale(p.s,p.s);x.fillStyle='#ffc531';x.strokeStyle='#d98a10';x.lineWidth=1.4;x.beginPath();x.moveTo(-9,6);x.lineTo(9,6);x.lineTo(9,-4);x.lineTo(-9,2);x.closePath();x.fill();x.stroke();
      x.fillStyle='#ffe489';x.beginPath();x.moveTo(-9,2);x.lineTo(9,-4);x.lineTo(2,-8);x.closePath();x.fill();x.stroke();x.fillStyle='#e8a612';x.beginPath();x.arc(-3,3.5,1.5,0,7);x.arc(4,2,1.2,0,7);x.fill();}
    else if(p.t==='heart'){x.fillStyle=p.c==='#ffffff'?'#ff4f9a':p.c;x.beginPath();x.moveTo(0,4);x.bezierCurveTo(-9,-3,-5,-10,0,-5);x.bezierCurveTo(5,-10,9,-3,0,4);x.fill();}
    else{x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));}x.restore();}
  if(FX.parts.length)requestAnimationFrame(fxStep);else{FX.run=false;x.clearRect(0,0,cv.width,cv.height);}}

/* ================= Tastatur & Zoom (iPhone) =================
   - Viewport: kein Reinzoomen (zusätzlich haben alle Eingabefelder 16px)
   - Tastatur offen: Die App bekommt genau die sichtbare Höhe (visualViewport) → Eingabefeld sitzt direkt
     über der Tastatur, der Chatverlauf darüber bleibt sichtbar und scrollbar, neueste Nachricht unten.
   - In der iPhone-App verkleinert das Capacitor-Keyboard-Plugin die Ansicht selbst (resize: native). */
const KB={open:false,raf:0};
function fixViewportMeta(){try{let m=document.querySelector('meta[name="viewport"]');if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}
  m.setAttribute('content','width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content');}catch(_){}}
function kbKeepVisible(){if(UI.chatId&&!$('#chat').hidden)scrollChat();const a=document.activeElement;
  if(KB.open&&a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.closest('#chatFoot,#callType')){try{a.scrollIntoView({block:'center',behavior:'smooth'});}catch(_){}}}
function kbSet(on){if(on===KB.open)return;KB.open=on;document.documentElement.classList.toggle('kb',on);setTimeout(kbKeepVisible,60);}
function kbFit(){cancelAnimationFrame(KB.raf);KB.raf=requestAnimationFrame(()=>{const vv=window.visualViewport,app=$('#app');if(!vv||!app)return;
  const full=document.documentElement.clientHeight||window.innerHeight;const open=full-vv.height>150;
  if(open){app.style.top=Math.max(0,vv.offsetTop)+'px';app.style.height=vv.height+'px';app.style.bottom='auto';}
  else{app.style.top='';app.style.height='';app.style.bottom='';if(window.scrollY)window.scrollTo(0,0);}
  if(!capNative())kbSet(open);else if(open)kbSet(true);kbKeepVisible();});}
function initKeyboard(){fixViewportMeta();const vv=window.visualViewport;
  if(vv){vv.addEventListener('resize',kbFit);vv.addEventListener('scroll',kbFit);}
  /* iPhone-App: Ereignisse des Capacitor-Keyboard-Plugins */
  window.addEventListener('keyboardWillShow',()=>kbSet(true));window.addEventListener('keyboardDidShow',kbKeepVisible);window.addEventListener('keyboardWillHide',()=>kbSet(false));
  try{const K=capNative()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Keyboard;if(K){if(K.setScroll)K.setScroll({isDisabled:true}).catch(()=>{});if(K.setAccessoryBarVisible)K.setAccessoryBarVisible({isVisible:false}).catch(()=>{});}}catch(_){}
  /* Fokus in ein Feld: Seite nicht verschieben, neueste Nachricht zeigen */
  document.addEventListener('focusin',e=>{if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;setTimeout(kbFit,50);setTimeout(kbFit,350);});
  document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA)$/.test(a.tagName)){kbFit();if(!window.visualViewport)kbSet(false);}},120));
  /* Wird der Chatbereich kleiner (Tastatur), bleibt die neueste Nachricht sichtbar */
  try{const body=$('#chatBody');let lastH=body.clientHeight,atB=true;body.addEventListener('scroll',()=>{atB=body.scrollHeight-body.scrollTop-body.clientHeight<80;},{passive:true});
    new ResizeObserver(()=>{const h=body.clientHeight;if(h<lastH&&(atB||document.activeElement===$('#msgIn')))body.scrollTop=body.scrollHeight;lastH=h;}).observe(body);}catch(_){}}

    try{rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);}catch(_){stream.getTracks().forEach(t=>t.stop());stream=null;if(!native){toast('🎤 Aufnahme nicht möglich 😕','',2400);return;}}}
  REC={on:true,id,rec,stream,chunks:[],t0:Date.now(),text:'',final:'',sr:null,timer:0,native:false};if(rec)rec.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
  /* Abschrift: im Browser Web Speech API, in der iPhone-App das native Plugin */
  if(!native&&SRec){try{const sr=new SRec();sr.lang='de-DE';sr.interimResults=true;sr.continuous=true;
      sr.onresult=e=>{let fi='',int='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fi+=r[0].transcript+' ';else int+=r[0].transcript;}REC.final=(REC.base||'')+fi;REC.text=(REC.final+int).trim();updRecBar();};
      sr.onend=()=>{if(REC.on&&REC.sr===sr){REC.base=REC.final;try{sr.start();}catch(_){}}};sr.onerror=()=>{};sr.start();REC.sr=sr;}catch(_){}}
  if(native){try{const P=STT.plugin;await P.removeAllListeners();await P.addListener('partialResults',d=>{const m=d&&d.matches&&d.matches[0];if(m&&REC.on){REC.text=m;REC.final=m;updRecBar();}});
      await P.start({language:'de-DE',maxResults:1,partialResults:true,popup:false});REC.native=true;}catch(_){if(!rec){REC.on=false;toast('🎤 Spracherkennung konnte nicht starten 😕','',2400);return;}}}
  if(rec){try{rec.start(250);}catch(_){}}Sound.micOn();renderRecBar();REC.timer=setInterval(()=>{updRecBar();if(Date.now()-REC.t0>60000)stopVoiceRec(true);},250);}
function renderRecBar(){const f=$('#chatFoot');f.innerHTML=`<div class="recbar"><button class="rx" id="recX" aria-label="Verwerfen">${ICO('x')}</button><span class="rdot"></span><b id="recT">0:00</b><span class="rtx" id="recTx">Sprich jetzt…</span><button class="sendb" id="recS" aria-label="Senden">${ICO('send')}</button></div>`;
  $('#recX').onclick=()=>stopVoiceRec(false);$('#recS').onclick=()=>stopVoiceRec(true);}
function updRecBar(){const t=$('#recT');if(!t||!REC.on)return;const s=Math.floor((Date.now()-REC.t0)/1000);t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');const x=$('#recTx');if(x)x.textContent=REC.text||'Sprich jetzt…';}
async function stopVoiceRec(send){const R=REC;if(!R.on)return;R.on=false;clearInterval(R.timer);try{if(R.sr)R.sr.stop();}catch(_){}
  if(R.native){try{await STT.plugin.stop();}catch(_){}try{await STT.plugin.removeAllListeners();}catch(_){}}
  if(R.rec){const stopped=new Promise(res=>{R.rec.onstop=res;setTimeout(res,1500);});try{R.rec.stop();}catch(_){}await stopped;}if(R.stream)R.stream.getTracks().forEach(t=>t.stop());Sound.micOff();
  const dur=Math.max(1,Math.round((Date.now()-R.t0)/1000));if(UI.chatId===R.id)chatFoot(R.id);if(!send)return;
  await sleep(350);const text=(R.text||R.final||'').trim();let vid=null;
  if(R.rec){const blob=new Blob(R.chunks,{type:(R.rec.mimeType||'audio/webm').split(';')[0]});if(blob.size){vid='vm_'+Date.now();await mediaPut(vid,blob);}}
  if(!vid&&!text){toast('Die Aufnahme ist leer 😕','',2000);return;}sendVoice(R.id,vid,dur,text);}

async function playVoice(bubble,m,personId){if(PLAY.el===bubble){stopPlay();return;}stopPlay();

  if(m.voice){const u=m.voice.id?await mediaURL(m.voice.id):null;if(!u){stopPlay();toast(m.voice.id?'Diese Sprachnachricht ist nicht mehr gespeichert 😕':'Von dieser Sprachnachricht gibt es nur den Text (tippe auf „Aa“).','',2400);return;}const a=new Audio(u);PLAY.audio=a;a.onended=stopPlay;a.onerror=stopPlay;try{await a.play();}catch(_){stopPlay();}}
  else if(m.vm){if(!window.speechSynthesis&&!cloudTTSOn()){stopPlay();toast('Dein Browser kann keine Sprachnachrichten vorlesen 😕','',2400);return;}unlockTTS();PLAY.tts=speakHer(m.t,personId,()=>{if(PLAY.el===bubble){PLAY.tts=null;stopPlay();}});}}

  $('#pfAv').onclick=()=>{Sound.click();openCreator('edit',()=>{renderProfil();});};$('#pfEdit').onclick=()=>{Sound.click();editProfileSheet();};$('#pfSet').onclick=()=>{Sound.click();openSettings();};
  $('#pfBio').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Claude liest…';try{const r=await aiBioCheck(S.bio);S.bioAI={bio:(S.bio||'').trim(),score:r.score,tip:r.tip};saveNow();Sound.good(r.score>=10);toast('✍️ Bio: '+r.score+'/15 Punkte','gold',2400);}
    catch(err){toast(esc(aiErrorText(err,'Claude')),'',3600);}if(UI.tab==='vProfil')renderProfil();};}
function editProfileSheet(){let age=S.age;const s=openSheet(`<h3>Name &amp; Bio</h3><p>Eine witzige, ehrliche Bio bringt mehr Matches.</p>
  <div class="field"><label for="peName">Name</label><input id="peName" maxlength="16" value="${esc(S.name)}" autocomplete="off"></div>
  <div class="field"><label>Alter</label><div class="stepper"><button data-a="-1" aria-label="Jünger">−</button><b id="peAge">${age}</b><button data-a="1" aria-label="Älter">+</button></div></div>
  <div class="field"><label for="peBio">Bio</label><textarea id="peBio" maxlength="220">${esc(S.bio)}</textarea><span class="cnt" id="peCnt"></span><button class="btn small line" id="peIdea">${ICO('bulb')} Ideen</button><div class="bioideas" id="peIdeas" hidden></div></div>
  <button class="btn prim block" id="peSave">Speichern</button>`);
  const bio=s.querySelector('#peBio'),cnt=s.querySelector('#peCnt');const upd=()=>{cnt.textContent=bio.value.length+' / 220';};upd();bio.oninput=upd;
  s.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{age=clamp(age+ +b.dataset.a,20,60);s.querySelector('#peAge').textContent=age;Sound.click();});
  s.querySelector('#peIdea').onclick=()=>{const box=s.querySelector('#peIdeas');box.hidden=false;box.innerHTML='';shuffle(BIO_IDEAS.slice()).slice(0,3).forEach(t=>{const b=el('button');b.textContent=t;b.onclick=()=>{bio.value=t;upd();box.hidden=true;};box.appendChild(b);});};
  s.querySelector('#peSave').onclick=()=>{S.name=(s.querySelector('#peName').value.trim()||S.name||'Kevin').slice(0,16);S.age=age;S.bio=bio.value.trim().slice(0,220);saveNow();Sound.match();closeSheet();toast('Profil gespeichert ✅','green',1800);if(UI.tab==='vProfil')renderProfil();};}
/* ---------- Einstellungen ---------- */
function openSettings(){const s=openSheet(`<h3>${ICO('gear')} Einstellungen</h3>
  <div class="lbl">KI &amp; Datenschutz</div>${aiStatusHTML().replace('class="aistat','id="aiStat" class="aistat')}
  <div class="row"><span>KI-Chat erlauben<small class="rowsub">Nachrichten, Fotos und Sprach-Abschriften gehen an die KI (Claude von Anthropic)</small></span><button class="toggle${aiConsent()?' on':''}" id="consentT" aria-label="KI-Chat erlauben"></button></div>
  <div class="row"><span>Datenschutzerklärung</span><button class="btn small line" id="privBtn">Öffnen</button></div>
  <p class="hint" style="margin:0 0 6px">🤖 Alle Personen in Leg den Käse sind KI-Figuren und nicht echt. Melden &amp; Blockieren findest du in jedem Chat und Anruf über ⋮.</p>
  <div class="lbl">Ton</div>
  <div class="row"><span>Musik</span><button class="toggle${S.opt.music?' on':''}" data-opt="music" aria-label="Musik"></button></div>
  <div class="row"><span>Soundeffekte</span><button class="toggle${S.opt.sfx?' on':''}" data-opt="sfx" aria-label="Soundeffekte"></button></div>
  <div class="row"><span>Sprachausgabe im Videoanruf</span><button class="toggle${S.opt.voice?' on':''}" data-opt="voice" aria-label="Sprachausgabe"></button></div>
  <div class="row"><span>Natürliche KI-Stimmen<small class="rowsub" id="vStat">${voiceStatusText()}</small></span><button class="toggle${S.opt.cloudVoice!==false?' on':''}" data-opt="cloudVoice" aria-label="Natürliche KI-Stimmen"></button></div>
  <div class="field" style="margin-top:6px"><label for="voiceSel">Handy-Stimme (wird genutzt, wenn keine KI-Stimme da ist)</label><select id="voiceSel"></select></div>
  <p class="hint" style="margin:-4px 0 10px">💡 Natürlicher klingt es mit einer „Premium“- oder „Erweitert“-Stimme: iPhone → Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch → z. B. „Anna (Erweitert)“ laden. Android → Einstellungen → Sprachausgabe → Google → Sprachdaten installieren → Deutsch (weibliche Stimme). Danach hier auswählen (★ = natürliche Stimme).</p>
  <div class="field"><label>Stimmlage</label><div class="seg" id="toneSeg">${[['suess','Süß'],['natuerlich','Natürlich']].map(([k,n])=>`<button data-tone="${k}" class="${(S.opt.voiceTone||'suess')===k?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="field"><label>Sprechtempo</label><div class="seg" id="rateSeg">${[[.85,'Langsam'],[1,'Normal'],[1.12,'Schnell']].map(([r,n])=>`<button data-rate="${r}" class="${(S.opt.voiceRate||1)===r?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="row"><span>Stimmen anhören</span><button class="btn small line" id="voiceTest">🔊 Test</button></div>
  <div class="lbl">Spielstand</div>
  <div class="row"><span>Alles löschen und neu anfangen</span><button class="btn small gray" id="pfReset">Zurücksetzen</button></div>
  <p class="hint">Leg den Käse ${VERSION} · Swipen, Avatar, Shop und Profil funktionieren auch offline. Dein Spielstand bleibt auf diesem Gerät.</p>`);
  s.querySelector('#consentT').onclick=e=>{const b=e.currentTarget;if(aiConsent()){S.consent=Object.assign({},S.consent,{ai:false});saveNow();b.classList.remove('on');toast('KI-Chat ausgeschaltet. Swipen, Shop und Profil gehen weiter.','',2600);uiAiStatus();}
    else{closeSheet();showConsent(()=>{toast('KI-Chat ist wieder an ✅','green',2000);});}};
  s.querySelector('#privBtn').onclick=()=>{Sound.click();openPrivacy();};
  checkCloudTTS();s.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const k=b.dataset.opt;S.opt[k]=k==='cloudVoice'?S.opt[k]===false:!S.opt[k];saveNow();b.classList.toggle('on',S.opt[k]!==false&&!!S.opt[k]);uiVoiceStatus();Sound.init();Sound.applyOpts();if(k==='music'){if(S.opt.music)Music.start();else Music.stop();}Sound.click();});
  const vs=s.querySelector('#voiceSel');const fillVoices=()=>{const all=germanVoices();vs.innerHTML=`<option value="">Automatisch (deutlichste Stimme)</option>`+all.map(v=>`<option value="${esc(v.name)}">${esc(v.name)}${GOOD_VOICE.test(v.name)?' ★':''}</option>`).join('');
    vs.value=all.some(v=>v.name===S.opt.voiceName)?S.opt.voiceName:'';if(!all.length)vs.innerHTML='<option value="">Standardstimme des Geräts</option>';};fillVoices();setTimeout(fillVoices,700);
  vs.onchange=()=>{S.opt.voiceName=vs.value;saveNow();demoVoice(vs.value?[PEOPLE_IDS[1]]:null);};
  s.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{S.opt.voiceRate=+b.dataset.rate;saveNow();s.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===b));demoVoice([PEOPLE_IDS[1]]);});
  s.querySelectorAll('[data-tone]').forEach(b=>b.onclick=()=>{S.opt.voiceTone=b.dataset.tone;saveNow();s.querySelectorAll('[data-tone]').forEach(x=>x.classList.toggle('on',x===b));demoVoice(['nina']);});
  s.querySelector('#voiceTest').onclick=()=>demoVoice();
  s.querySelector('#pfReset').onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Wirklich löschen?';b.className='btn small prim';Sound.bad();setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Zurücksetzen';b.className='btn small gray';}},3500);return;}
    /* Geräte-ID bleibt (Tageslimit), alles andere wird gelöscht */const dev=S.deviceId,use=S.aiUse;try{localStorage.removeItem(SAVE_KEY);}catch(_){}mediaClear();loadSave();S.deviceId=dev;S.aiUse=use;ensureDaily();UI.pending={};UI.drafts={};closeSheet();uiTop();uiBadges();uiLikes(0);UI.tab='';showTab('vSwipe');saveNow();showAiNotice(showWelcome);};}
/* Stimmen-Vorschau: drei Charaktere stellen sich vor */
/* Status der natürlichen Stimmen in den Einstellungen */
function voiceStatusText(){if(window.__artifact)return 'In der Claude-Vorschau nicht verfügbar – dort spricht das Gerät.';if(!serverReady())return 'Braucht den KI-Server – bis dahin spricht das Handy.';
  if(S.opt.cloudVoice===false)return 'Aus – es spricht die Stimme des Handys.';return NTTS.ok===true?'Aktiv ✅ Jede Frau hat ihre eigene, echt klingende Stimme.':NTTS.ok===false?'Auf dem Server noch nicht eingerichtet – es spricht die Stimme des Handys.':'Wird geprüft …';}
function uiVoiceStatus(){const e=$('#vStat');if(e)e.textContent=voiceStatusText();}
function demoVoice(ids){if((!window.speechSynthesis||!window.SpeechSynthesisUtterance)&&!cloudTTSOn()){toast('Dein Gerät hat keine Sprachausgabe 😕','',2400);return;}unlockTTS();
  ids=ids||['lara','nina','aylin'];const lines={lara:'Hey, ich bin Lara! Zwanzig Liegestütze, jetzt sofort!',nina:'Na, Süßer? Ich bin Nina. Verstehst du mich gut?',aylin:'Ich bin Aylin. Und du hörst mir jetzt gefälligst zu.'};
  let i=0;const next=()=>{if(i>=ids.length)return;const id=ids[i++];speakHer(lines[id]||('Hallo, ich bin '+PEOPLE[id].name+'. Verstehst du mich gut?'),id,()=>setTimeout(next,250));};stopHer();next();}

/* ================= Ziele: Tagesbelohnung, Aufgaben, Rang ================= */
function renderZiele(){const v=$('#vZiele');ensureDaily();keepScroll(v,()=>{const can=dailyClaimable(),d=todayKey();
  const yest=S.daily.lastClaim&&dayDiff(S.daily.lastClaim,d)===1;const streakNow=can?(yest?S.daily.streak:0):S.daily.streak;const curIdx=can?streakNow%7:(streakNow-1)%7;
  let h=`<h2 class="vt">Ziele</h2><p class="sub">Überhol Chad Käsekönig auf Platz 1 – und hol dir die Krone!</p>${boardHTML()}
  <div class="box"><h3>${ICO('gift')} Tägliche Belohnung <small>Serie: ${streakNow} Tag${streakNow===1?'':'e'}</small></h3><div class="days">${DAILY_REWARD.map((c,i)=>{const done=i<curIdx||(!can&&i===curIdx),today=can&&i===curIdx;
      return `<div class="day${done?' done':''}${today?' today':''}">Tag ${i+1}<i class="coin"></i>${c}</div>`;}).join('')}</div>
    ${can?`<button class="btn prim block" id="zClaim">${ICO('gift')} ${DAILY_REWARD[curIdx]} Coins abholen</button>`:`<button class="btn gray block" disabled>Morgen gibt es mehr! ${ICO('check')}</button>`}</div>
  <div class="box"><h3>${ICO('check')} Aufgaben von heute</h3>${S.daily.tasks.map((t,i)=>{const T=taskDef(t.id);return `<div class="task"><div class="tx"><b>${esc(T.n)}</b><small><i class="coin"></i> ${T.coins} · ${T.xp} XP · +2 👍 · ${t.prog}/${T.goal}</small><div class="meter"><i style="width:${t.prog/T.goal*100}%"></i></div></div>
      ${t.claimed?`<span style="color:var(--green);font-size:22px">${ICO('check')}</span>`:t.done?`<button class="btn small prim" data-task="${i}">Abholen</button>`:''}</div>`;}).join('')}</div>`;
  const r=S.rank,nx=RANKS[r+1],prog=nx?(S.xp-RANKS[r].xp)/(nx.xp-RANKS[r].xp):1;
  h+=`<div class="box"><h3>${ICO('crown')} Dein Rang <small>${fmtN(S.xp)} XP</small></h3><div class="mlabel"><span>${esc(RANKS[r].n)}</span><span>${nx?'nächster: '+esc(nx.n)+' ('+fmtN(nx.xp)+' XP)':'Höchster Rang! 👑'}</span></div><div class="meter" style="margin-bottom:12px"><i style="width:${clamp(prog*100,0,100)}%"></i></div>
    <div class="ranks">${RANKS.map((k,i)=>`<div class="rk${i===r?' cur':''}${i>r?' lock':''}"><i class="ico i-${i>r?'lock':'crown'}" style="color:${i===r?'#fff':k.c}"></i>${esc(k.n)}<small>${fmtN(k.xp)} XP</small></div>`).join('')}</div>
    <p class="sub" style="margin:10px 0 0">XP gibt es für Matches, Nachrichten, die gut ankommen, Singles, die sich in dich verknallen, Videoanrufe und Aufgaben. Ein höherer Rang macht dein Profil attraktiver.</p></div>`;
  v.innerHTML=h;});
  const v2=$('#vZiele');const c=v2.querySelector('#zClaim');if(c)c.onclick=()=>{const n=claimDaily();if(n){Sound.coin();confetti(90,null,200,true);toast('🎁 +'+n+' Coins! Bis morgen 😊','gold');}uiBadges();renderZiele();};
  v2.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{if(claimTask(+b.dataset.task)){Sound.buy();confetti(40,null,260,true);}uiBadges();renderZiele();});}
/* Käse-Rangliste (Top 10) */
function boardHTML(){const b=board(),pos=myPos(),nx=nextUp();const avatar=r=>r.me?meFig('head',{anim:false}):r.id==='chad'?herFig('chad','head',{anim:false}):'🧀';
  let h=`<div class="box"><h3>🏆 Käse-Rangliste <small>Du: Platz ${pos}</small></h3><div class="lb">${b.map((r,i)=>`<div class="lbr${r.me?' me':''}${r.id==='chad'?' chad':''}"><span class="lbi">${i===0?'👑':i+1}</span><span class="lba">${avatar(r)}</span><span class="lbn">${esc(r.me?(S.name||'Du')+' (du)':r.n)}</span><span class="lbp">${fmtN(r.kp)} 🧀</span></div>`).join('')}</div>`;
  if(nx){const gap=nx.kp-S.rival.kp+1;const base=b[pos]?b[pos].kp:0;const prog=clamp((S.rival.kp-base)/Math.max(1,nx.kp+1-base),0,1);
    h+=`<div class="mlabel"><span>Noch ${fmtN(gap)} 🧀 bis Platz ${pos-1}</span><span>${esc(nx.n)}</span></div><div class="meter" style="margin-bottom:8px"><i style="width:${prog*100}%"></i></div>`;}
  else h+=`<p class="hint" style="margin:0 0 8px;color:var(--ink);font-size:13px"><b>👑 Du bist der Käsekönig!</b> Chad ist auf Platz 2 und schäumt vor Wut.</p>`;
  return h+`<p class="hint" style="margin:0">Käse-Punkte: Match +${KP.match} (Käse-Like +${KP.superMatch}) · gut angekommene Nachricht bis +24 · verknallt +${KP.crush} · Video-Date +${KP.call} · blockiert ${KP.blocked}</p></div>`;}

/* ================= Start ================= */
function boot(){loadSave();ensureDaily();$('#logoIco').innerHTML=cheeseSVG(false);uiTop();
  $$('#tabs button').forEach(b=>b.onclick=()=>{Sound.tab();if(!$('#chat').hidden)closeChat();showTab(b.dataset.tab);});
  $('#rankChip').onclick=()=>{Sound.tab();if(!$('#chat').hidden)closeChat();showTab('vZiele');};$('#coinChip').onclick=()=>{Sound.tab();if(!$('#chat').hidden)closeChat();showTab('vShop');};
  $('#gearBtn').onclick=()=>{Sound.click();openSettings();};
  initKeyboard();initSwipe();initChat();initCall();UI.tab='';showTab('vSwipe');uiBadges();aiInitApp();
  /* Erster Start: zuerst der KI-Hinweis (auch für Spieler, die schon vor dem Hinweis gespielt haben) */
  const go=()=>{if(!S.started){if(S.look)showProfileStep();else showWelcome();}};
  if(!S.consent)showAiNotice(go);else go();
  if(S.started){ensureChad();if(!S.ps.chad.msgs.length)setTimeout(()=>chadSay('intro',true),3000);else if(Date.now()-(S.rival.lastTaunt||0)>3*3600e3){S.rival.lastTaunt=Date.now();setTimeout(()=>chadSay('taunt',true),9000);}
    if(dailyClaimable())setTimeout(()=>toast('🎁 Deine tägliche Belohnung wartet im Ziele-Tab!','gold',3000),900);}
  window.addEventListener('online',()=>{uiAiStatus();flushReports();});setTimeout(flushReports,4000);setTimeout(()=>{if(aiConsent())checkCloudTTS();},2500);window.addEventListener('offline',()=>uiAiStatus());
  if(!window.__noSW&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  setInterval(()=>{if(ensureDaily()){uiBadges();if(UI.tab==='vZiele')renderZiele();}},60000);
  window.__ldk={get S(){return S;},addKP,board,myPos,chadSay,PEOPLE,PEOPLE_IDS,swipe,applyDelta,matchChance,attractiveness,aiMode,AI,CALL,processReply};}
/* Falls beim Start etwas schiefgeht (z. B. kaputter Spielstand): Rettungs-Bildschirm statt weißer Seite */
function safeBoot(){try{boot();}catch(e){try{console.error(e);}catch(_){}const o=document.getElementById('onboard');if(!o)return;o.hidden=false;
  o.innerHTML='<div class="sp"></div><div class="ntitle">Uups! 🧀</div><div class="ncard"><b>Das Spiel konnte nicht richtig starten.</b><p>Meist hilft es, die App neu zu öffnen. Wenn das nicht klappt, kannst du den Spielstand zurücksetzen.</p></div><button class="btn white" id="rbReload">Nochmal versuchen</button><button class="nlink" id="rbReset">Spielstand zurücksetzen</button><div class="sp"></div>';
  document.getElementById('rbReload').onclick=()=>location.reload();
  document.getElementById('rbReset').onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Wirklich alles löschen? Nochmal tippen';return;}try{localStorage.removeItem(SAVE_KEY);}catch(_){}try{indexedDB.deleteDatabase('legdenkaese-media');}catch(_){}location.reload();};}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',safeBoot);else safeBoot();

</script>
